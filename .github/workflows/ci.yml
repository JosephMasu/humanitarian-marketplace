name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker daemon.
      - name: Maven verify
        run: mvn -B -ntp verify

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [api-gateway, user-service, organization-service]
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker build
          -f infrastructure/docker/Dockerfile
          --build-arg SERVICE=${{ matrix.service }}
          -t humanitarian-marketplace/${{ matrix.service }}:ci .
