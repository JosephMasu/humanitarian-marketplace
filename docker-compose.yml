# Local development stack. Dev-only credentials; never reuse them anywhere else.
#   docker compose up --build            # everything
#   docker compose up postgres keycloak  # infra only, run services from the IDE
name: humanitarian-marketplace

x-service-env: &service-env
  SERVER_PORT: "8080"
  # Tokens are issued to browsers via localhost:8180, so that is the `iss` we validate...
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/humanitarian-marketplace
  # ...but inside the network, signing keys are fetched from keycloak:8080.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/humanitarian-marketplace/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_PORT: "8080"
      # Public URL baked into tokens; backchannel calls from services use keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/realm-humanitarian-marketplace.json:/opt/keycloak/data/import/realm-humanitarian-marketplace.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: user-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  organization-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: organization-service
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/organization_service
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      <<: *service-env
      USER_SERVICE_URL: http://user-service:8080
      ORGANIZATION_SERVICE_URL: http://organization-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - organization-service

volumes:
  postgres-data:
